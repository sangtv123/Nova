<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Todo App</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    h1 { margin-top: 0; color: #38bdf8; }
    .input-section { display: flex; gap: 10px; margin-bottom: 20px; }
    .input-section input { flex: 1; padding: 10px; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 16px; }
    .input-section button { padding: 10px 20px; background: #10b981; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px; }
    .input-section button:hover { background: #059669; }
    .stats { display: flex; gap: 20px; padding: 15px; background: #0f172a; border-radius: 4px; margin-bottom: 20px; }
    .stats strong { color: #a78bfa; }
    .filters { display: flex; gap: 10px; margin-bottom: 20px; }
    .filters button { padding: 8px 12px; background: #475569; color: white; border: none; border-radius: 4px; cursor: pointer; text-transform: capitalize; }
    .filters button.active { background: #38bdf8; color: #0f172a; font-weight: bold; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; align-items: center; gap: 10px; padding: 12px; border-bottom: 1px solid #334155; }
    li.completed span { text-decoration: line-through; opacity: 0.6; }
    li span { flex: 1; font-size: 16px; }
    li input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
    li button { padding: 6px 10px; background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer; }
    li button:hover { background: #dc2626; }
    #clear-completed { margin-top: 20px; padding: 8px 16px; background: #64748b; color: white; border: none; border-radius: 4px; cursor: pointer; }
    #clear-completed:hover { background: #475569; }
    .empty { text-align: center; color: #94a3b8; padding: 20px 0; font-style: italic; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 Todo App</h1>
    
    <div class="input-section">
      <input type="text" id="new-todo" placeholder="Add a new todo...">
      <button id="add-todo">Add</button>
    </div>

    <div class="stats">
      <div>Total: <strong id="stat-total">0</strong></div>
      <div>Active: <strong id="stat-active">0</strong></div>
      <div>Completed: <strong id="stat-completed">0</strong></div>
    </div>

    <div class="filters">
      <button id="filter-all" class="filter-btn active" data-filter="all">All</button>
      <button id="filter-active" class="filter-btn" data-filter="active">Active</button>
      <button id="filter-completed" class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <div id="todo-list-container"></div>

    <button id="clear-completed" style="display: none;">Clear Completed</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "@nova/signals": "/packages/signals/dist/index.js"
      }
    }
  </script>
  <script type="module" src="/examples/todo-app/client.js"></script>
</body>
</html>
