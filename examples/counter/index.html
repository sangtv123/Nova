<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Framework - Browser Demo</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 400px;
    }
    h1 {
      margin-top: 0;
      color: #38bdf8;
      text-align: center;
    }
    .stats {
      background: #0f172a;
      padding: 1rem;
      border-radius: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .stats p {
      margin: 0.5rem 0;
      font-size: 1.1rem;
    }
    .stats strong {
      color: #a78bfa;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .row {
      display: flex;
      gap: 0.5rem;
    }
    button {
      flex: 1;
      padding: 0.75rem;
      border: none;
      border-radius: 0.5rem;
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover {
      background: #7dd3fc;
    }
    button:active {
      transform: scale(0.95);
    }
    button.secondary {
      background: #475569;
      color: #f8fafc;
    }
    button.secondary:hover {
      background: #64748b;
    }
    input {
      padding: 0.5rem;
      border-radius: 0.25rem;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      width: 80px;
    }
    label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Nova Signals</h1>
    
    <div class="stats">
      <p>Count: <strong id="val-count">0</strong></p>
      <p>Doubled: <strong id="val-doubled">0</strong></p>
      <p>Quadrupled: <strong id="val-quadrupled">0</strong></p>
    </div>

    <div class="controls">
      <label>
        Step: <input type="number" id="input-step" value="1" min="1">
      </label>
      
      <div class="row">
        <button id="btn-add">Add</button>
        <button id="btn-sub">Subtract</button>
      </div>
      <div class="row">
        <button id="btn-reset" class="secondary">Reset</button>
        <button id="btn-random" class="secondary">Random</button>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "@nova/signals": "/packages/signals/dist/index.js"
      }
    }
  </script>
  <script type="module" src="/examples/counter/client.js"></script>
</body>
</html>
